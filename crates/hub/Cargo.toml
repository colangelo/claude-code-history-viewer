[package]
name = "hub"
version.workspace = true
edition = "2021"
# 1.80 is the floor of the embedder dependency graph (safetensors declares it);
# the other workspace crates stay at 1.77.2.
rust-version = "1.80"
license = "MIT"
description = "Central archive hub: the only service that touches Postgres (ingest + search/browse API)"

[lints]
workspace = true

[dependencies]
archive-protocol = { path = "../protocol" }
# Stat response types are reused verbatim from the parser library, so the
# migrated frontend keeps its types and only swaps data source (design D9).
history-core = { path = "../history-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
# Columnar read model for statistics. `bundled` compiles libduckdb from source
# and links it statically (verified: no libduckdb dylib reference, so the
# codesign-aware binary swap in docs/archive/deployment.md §2b is unaffected).
# Costs ~40 MB of binary and ~873s CPU to build — measured in change
# hub-stats-duckdb-mirror task 1.2. IANA timezone support is in DuckDB core as
# of 1.5.5; do NOT emit `LOAD icu`, which is absent from the bundled build and
# would attempt a runtime download (design D7).
duckdb = { version = "1.10505", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
# In-process CPU embedder (semantic journal search). Pure Rust — no native
# runtime library, so the §2b single-binary codesign swap story is unchanged.
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
