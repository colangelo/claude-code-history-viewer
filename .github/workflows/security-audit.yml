name: Security Audit

# `cargo audit` is time-dependent: an advisory published against a dependency
# turns this red with no change on our side. Gating every push on it made every
# release commit fail, so it runs on the things that can actually act on it —
# a dependency change, a weekly sweep, or on demand — rather than as a blanket
# push gate in rust-tests.yml.
#
# Advisories we cannot act on are ignored, with reasons, in .cargo/audit.toml.

on:
  schedule:
    # Mondays 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/security-audit.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary — `cargo install cargo-audit --locked` spent ~2 minutes
      # compiling it on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        # Lockfile lives at the workspace root since the crates extraction
        # (was src-tauri/Cargo.lock). Run audit from the root.
        run: cargo audit

      # SOME ignores in .cargo/audit.toml rest on "the crate is not in the build
      # graph" — a `cargo tree -i <crate>` that printed nothing on the day the
      # entry was written. Nothing re-checks that, so such an entry silently
      # becomes a blindfold the moment a feature flag or a dependency bump pulls
      # the crate in: the advisory stays suppressed and the job stays green.
      #
      # ONLY the absence-based entries belong here. `quick-xml` is deliberately
      # NOT in this list — it IS in the graph (plist -> tauri/os_info) and its
      # ignore rests on the input being Tauri's own Info.plist rather than
      # attacker-supplied XML. Adding it would fail the build immediately, which
      # is how this list gets checked: a name here asserts absence, so verify
      # with `cargo tree -i <crate> --target all` before adding one.
      - name: Absence-based ignores must stay outside the build graph
        run: |
          set -uo pipefail
          status=0
          for crate in rsa rkyv; do
            if cargo tree -i "$crate" --target all --quiet 2>/dev/null | grep -q .; then
              echo "::error::$crate is now IN the build graph, but .cargo/audit.toml"\
                   "ignores its advisory on the grounds that it is not. Re-triage the"\
                   "entry — do not widen the ignore."
              cargo tree -i "$crate" --target all | head -20
              status=1
            else
              echo "ok: $crate is outside the build graph"
            fi
          done
          exit $status
