[workspace]
resolver = "2"
members = ["src-tauri", "crates/history-core", "crates/protocol", "crates/hub", "crates/sync-daemon", "crates/loop-evals"]

# ---------------------------------------------------------------------------
# Single fork-owned version line (`cchv-v*` tags). Every crate inherits this
# via `version.workspace = true`. `just sync-version` keeps package.json,
# this key, and tauri.conf.json aligned — package.json stays the entry point.
# NOT tied to upstream's `v1.x` desktop versions: this fork ships only the web
# viewer + archive stack, so it owns its own version. See CLAUDE.md → Version
# Management.
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.21.0"

# ---------------------------------------------------------------------------
# Shared lint configuration. Both the desktop app and the extracted
# `history-core` library inherit these via `[lints] workspace = true`, so the
# pedantic profile that the parsers were written against is preserved after the
# extraction. (Moved verbatim from src-tauri/Cargo.toml.)
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# "deny" (not "forbid") to allow selective #[allow(unsafe_code)] for mmap perf.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# nursery lints are too unstable - enable selectively if needed
# Allow certain lints that are too strict for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
# These are valid patterns in this codebase
similar_names = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
# Allow casting in numeric code (common in size/count calculations)
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Allow reasonable patterns
items_after_statements = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"
manual_let_else = "allow"
field_reassign_with_default = "allow"
manual_clamp = "allow"
map_unwrap_or = "allow"
ptr_arg = "allow"
format_push_string = "allow"
duplicated_attributes = "allow"
return_self_not_must_use = "allow"

# ---------------------------------------------------------------------------
# Profiles must be declared at the workspace root (cargo ignores profiles in
# member crates). Moved verbatim from src-tauri/Cargo.toml.
# ---------------------------------------------------------------------------
[profile.dev]
opt-level = 0
debug = true

# Optimize dependencies in dev mode (simd-json, rayon need optimization), and
# strip their debug info.
#
# `debug` is NOT inherited from a sibling key — `[profile.dev] debug = true`
# applies to every dependency unless overridden here, and this block previously
# set only `opt-level`. That cost real disk: `libduckdb-sys` bundles the whole
# DuckDB C source, so each build produced a **1.4 GB** rlib and a 1.4 GB
# `libduckdb.a`, almost entirely DWARF nobody reads — cargo never GCs stale
# build dirs, and seven feature-set permutations in two days had grown
# `target/` to **125 GB** (58 G deps + 35 G incremental + 23 G build).
#
# `false` here, not in `[profile.dev]`: OUR crates keep full debug info, which
# is where anyone actually steps. Third-party debug info is what we do not use.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1 # Faster test execution
debug = true

# `profile.test` inherits `profile.dev`, but package overrides do NOT carry
# across profiles — without this, `cargo test` rebuilds every dependency with
# full debug info again and the 125 GB comes straight back.
[profile.test.package."*"]
opt-level = 2
debug = false

# Profile for release builds with debug symbols (for coverage)
[profile.coverage]
inherits = "test"
debug = true
opt-level = 0
